# CSOAI Dashboard — Cloudflare Pages Configuration
# This file configures the Pages deployment

name = "csoai-gspc"
compatibility_date = "2024-12-18"

# Build configuration
[build]
command = "npm run build"
output_directory = ".next"

# Environment variables
[vars]
NEXT_PUBLIC_WORKER_URL = ""
ENVIRONMENT = "production"

# D1 Database binding (uncomment after creating the database)
# [[d1_databases]]
# binding = "DB"
# database_name = "csoai-gspc"
# database_id = "YOUR_DATABASE_ID_HERE"
