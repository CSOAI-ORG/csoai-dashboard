name: Sync MCP Registry

# Keeps client/src/data/mcpRegistry.json in sync with the CSOAI-ORG GitHub org.
# Runs daily and on demand. Commits to `deploy` only when the registry changes,
# which triggers the normal Vercel deploy.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch CSOAI-ORG repositories
        env:
          GH_TOKEN: ${{ secrets.GH_ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # /user/repos affiliation is the reliable way to enumerate the org's repos
          gh api "/user/repos?per_page=100&affiliation=owner,collaborator,organization_member&sort=updated" --paginate --slurp \
            | jq 'add | map(select(.full_name | startswith("CSOAI-ORG/")))' > repos.json
          echo "Fetched $(jq 'length' repos.json) CSOAI-ORG repos"

      - name: Regenerate registry + sitemap
        run: |
          python3 scripts/build_mcp_registry.py repos.json
          python3 scripts/build_sitemap.py

      - name: Commit if changed
        id: commit
        run: |
          rm -f repos.json
          if git diff --quiet -- client/src/data/mcpRegistry.json client/public/sitemap.xml; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add client/src/data/mcpRegistry.json client/public/sitemap.xml
          COUNT=$(jq '.total' client/src/data/mcpRegistry.json)
          git commit -m "chore(mcp): auto-sync registry + sitemap ($COUNT servers)"
          git push origin deploy
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow when content changed
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "Waiting for deploy to publish the new sitemap before notifying search engines..."
          sleep 420
          python3 scripts/indexnow.py
