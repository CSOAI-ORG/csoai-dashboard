name: Move csoai.org to v2 project

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify live site
        run: |
          {
            echo "# Live Site Verification"
            echo ""
            echo "Generated: $(date -u)"
            echo ""
            for U in https://csoai.org https://www.csoai.org; do
              echo "## $U"
              echo '```'
              echo "--- Headers ---"
              curl -s -I --max-time 25 "$U" | head -20
              echo "--- Title / brand check ---"
              curl -s -L --max-time 25 "$U" | grep -oiE '<title>[^<]*</title>|csoai|council for the safety' | head -10
              echo '```'
              echo ""
            done
          } > LIVE_VERIFICATION.md
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add LIVE_VERIFICATION.md
          git commit -m "chore: live verification [skip ci]" || echo "no changes"
          git push origin deploy || echo "push failed"
