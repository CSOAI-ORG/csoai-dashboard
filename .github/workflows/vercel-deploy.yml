name: Vercel Production Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Direct deploy - Vercel will build on their servers
          # --confirm creates project if doesn't exist
          echo "Deploying to Vercel..."
          vercel deploy --prod --yes --confirm --token=$VERCEL_TOKEN 2>&1 | tee deploy.log
          
          # Extract URL from output
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' deploy.log | tail -1)
          
          # If no URL found in expected format, try production URL pattern
          if [ -z "$URL" ]; then
            URL=$(grep -oE 'Production: https://[^ ]+' deploy.log | sed 's/Production: //')
          fi
          
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
