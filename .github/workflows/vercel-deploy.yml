name: Vercel Production Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Check token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Token length: ${#VERCEL_TOKEN}"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is empty!"
            exit 1
          fi
          # Verify token by checking who we are
          vercel whoami --token=$VERCEL_TOKEN || echo "Token verification failed"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -x  # Enable debug mode
          echo "Starting deployment..."
          
          # Deploy with verbose output
          vercel deploy --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          echo "Vercel exit code: $EXIT_CODE"
          echo "=== Full deploy log ==="
          cat deploy.log
          echo "=== End log ==="
          
          # Extract URL
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' deploy.log | tail -1)
          echo "Extracted URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          
          if [ -z "$URL" ] && [ $EXIT_CODE -ne 0 ]; then
            echo "Deployment failed!"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Deployment Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
