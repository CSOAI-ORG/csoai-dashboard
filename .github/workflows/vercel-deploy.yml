name: Vercel Production Deploy

# Runs on the GitHub-hosted runner (which CAN reach Vercel, unlike the dev sandbox).
# Triggered by pushing to the `deploy` branch, or manually.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Setup Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Link to existing project or create new one
          vercel link --yes --token="$VERCEL_TOKEN" 2>/dev/null || \
          vercel --version  # Fallback just to confirm CLI works

          # Pull environment/settings
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" || true

      - name: Build and Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Direct deploy without prebuilt (simpler, handles first-time)
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | grep -E "https://.*\.vercel\.app" | tail -1)
          if [ -z "$URL" ]; then
            # Fallback: try getting URL differently
            URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          fi
          echo "Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "### ✅ Deployed - ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
